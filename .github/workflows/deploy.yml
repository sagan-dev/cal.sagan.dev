name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Write .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > /opt/cal.diy/.env

      - name: Sync files
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            $GITHUB_WORKSPACE/ /opt/cal.diy/

      - name: Build and restart containers
        working-directory: /opt/cal.diy
        run: |
          docker compose build --pull
          docker compose up -d --remove-orphans

      - name: Verify health
        working-directory: /opt/cal.diy
        run: |
          echo "Waiting for calcom to become healthy..."
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' caldiy-calcom-1 2>/dev/null || echo "starting")
            echo "[$i/24] Status: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 10
          done
          echo "Container did not become healthy in time"
          docker compose logs --tail=50 calcom
          exit 1
